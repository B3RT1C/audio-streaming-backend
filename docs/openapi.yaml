openapi: 3.0.3
info:
  title: Audio Streaming API
  version: 0.3.0
  description: |
    Shared contract for the personal music library.
    There is no authentication: the service is meant to be reached only through the private network.
    List responses stay JSON arrays. New fields are added beside the previous ones.

    0.3.0 adds secondaryTitle on tracks, an artist catalog copied from track artist text,
    and tags on tracks, artists and playlists.

paths:
  /audios:
    get:
      summary: List tracks, optionally filtered
      parameters:
        - in: query
          name: q
          required: false
          schema:
            type: string
          description: >
            Case- and accent-insensitive substring match on title, secondaryTitle, artist,
            album, display name and original file name. Omitted or blank does not filter.
            Combined with tag, a track must match both. Results stay ordered by id.
        - in: query
          name: tag
          required: false
          schema:
            type: string
          description: >
            Exact tag name, case-insensitive and accent-sensitive ("jose" does not match "José").
            Not a substring. Omitted or blank does not filter. An unknown name returns an empty list.
      responses:
        '200':
          description: Track list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Track'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Upload an audio file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: mp3, m4a, aac, flac, wav, ogg, opus or webm audio. Default limit 500 MB.
                name:
                  type: string
                  description: Display name. Defaults to the tag title, or the file name without extension.
      responses:
        '201':
          description: File uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '400':
          description: Missing file, unsupported type, or invalid name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          description: File exceeds the configured upload limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                message: File exceeds the maximum upload size of 500MB
                code: FILE_TOO_LARGE
        '500':
          $ref: '#/components/responses/InternalError'

  /audios/{id}:
    get:
      summary: Stream an audio file
      description: >
        Content-Type matches the stored extension (not always audio/mpeg).
        A single Range is honored. A range that starts past the end of the file is 416.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: header
          name: Range
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Full audio stream
        '206':
          description: Partial content for the first byte range
        '416':
          description: Range not satisfiable. Content-Range is bytes */length.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      summary: Edit track metadata
      description: >
        Send only the fields to change. JSON null clears secondaryTitle, artist, album, trackNumber and durationSeconds.
        A blank secondaryTitle is stored as null. title and name cannot be cleared.
        Unknown fields are ignored, including tags. Tag changes use PUT /audios/{id}/tags.
        The whole track object can be sent back.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackPatch'
      responses:
        '200':
          description: Updated track
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '400':
          description: Invalid metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete a track and remove it from every playlist
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Track deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /audios/{id}/tags:
    put:
      summary: Replace the tags of a track
      description: >
        Replaces the whole set. Tags that do not exist yet are created.
        Names are trimmed. Matching ignores case and keeps the stored spelling
        ("LIVE" matches an existing "Live"). Duplicates in the array collapse to one tag.
        An empty array clears the track's tags but does not delete the tag records.
        At most 100 names. The response is the track, including secondaryTitle and tags
        sorted case-insensitively. This does not change GET /audios/{id}, which still streams audio.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagAssignment'
            example:
              tags: ["Live", "rock"]
      responses:
        '200':
          description: Track with the new tag set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '400':
          description: Missing tags, a non-string entry, an empty name, a name longer than 100 characters, or more than 100 names
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          $ref: '#/components/responses/NotFound'

  /tags:
    get:
      summary: List tags and how many subjects use each one
      description: >
        Ordered case-insensitively by name. A tag with no remaining links stays in the list
        with zero counts. audioCount, artistCount and playlistCount are separate.
      responses:
        '200':
          description: Tag catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
              example:
                - id: 1
                  name: Live
                  audioCount: 4
                  artistCount: 1
                  playlistCount: 0

  /artists:
    get:
      summary: List artists copied from track artist text
      description: >
        One row per exact artist string (case-sensitive). "Ana" and "ana" are different artists.
        The name matches audio.artist exactly, including spaces.
        Rows come from the 0.3.0 migration (distinct non-blank audio.artist values)
        and from later uploads, imports and PATCH artist changes.
        Clearing a track's artist does not delete the artist row.
        There is no POST /artists. Ordered case-insensitively by name, then by the exact name.
        audioCount is the number of tracks whose artist text equals name.
      responses:
        '200':
          description: Artist catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Artist'
              example:
                - id: 4
                  name: José
                  audioCount: 9
                  tags: ["Live"]

  /artists/{id}/tags:
    put:
      summary: Replace the tags of an artist
      description: >
        Same replacement rules as PUT /audios/{id}/tags.
        Does not change the artist name or any track's artist text.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagAssignment'
      responses:
        '200':
          description: Artist with the new tag set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artist'
        '400':
          description: Invalid tag list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Artist not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                message: Artist not found
                code: NOT_FOUND

  /playlists:
    get:
      summary: List playlists without their tracks
      responses:
        '200':
          description: Playlist summaries. items is omitted; use GET /playlists/{id} for the tracks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Playlist'
    post:
      summary: Create a playlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaylistName'
      responses:
        '201':
          description: Created playlist, with an empty items array
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '400':
          description: Missing or invalid name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /playlists/{id}:
    get:
      summary: Get a playlist and its tracks in playback order
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
      responses:
        '200':
          description: Playlist with items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Rename a playlist
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaylistName'
      responses:
        '200':
          description: Updated playlist, including its items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '400':
          description: Invalid name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete a playlist
      description: Does not delete the tracks themselves.
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
      responses:
        '204':
          description: Playlist deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /playlists/{id}/tags:
    put:
      summary: Replace the tags of a playlist
      description: >
        Same replacement rules as PUT /audios/{id}/tags.
        The response includes items and tags. updatedAt changes.
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagAssignment'
      responses:
        '200':
          description: Playlist with items and the new tag set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '400':
          description: Invalid tag list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          $ref: '#/components/responses/NotFound'

  /playlists/{id}/items:
    post:
      summary: Append a track
      description: >
        Adding a track that is already in the playlist returns 200 and does not duplicate it.
        A new track returns 201 and is placed at the end.
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audioId]
              properties:
                audioId:
                  type: integer
      responses:
        '200':
          description: Track was already in the playlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistItem'
        '201':
          description: Track appended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistItem'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Reorder the tracks
      description: >
        The list must contain exactly the audio ids already in the playlist, each once.
        Preferred body is {"audioIds":[3,1,2]}. A raw JSON array [3,1,2] is also accepted.
        Positions are rewritten from 1 in that order.
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audioIds]
              properties:
                audioIds:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: Playlist in the new order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '400':
          description: The list is not a permutation of the current tracks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          $ref: '#/components/responses/NotFound'

  /playlists/{id}/items/{audioId}:
    delete:
      summary: Remove a track from a playlist
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
        - in: path
          name: audioId
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Track removed from the playlist
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/import:
    post:
      summary: Copy every audio file under a server folder into the library
      description: >
        Recursive. Reads tags. Skips a file when its original path or content hash is already stored.
        Does not move or delete the originals. Non-audio files are ignored.
        The path must stay inside AUDIO_IMPORT_DIR. A missing path imports that directory itself.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  description: Absolute path, or a path relative to AUDIO_IMPORT_DIR.
      responses:
        '200':
          description: Import summary. Individual unreadable files increment failed and do not abort the run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '400':
          description: Import is disabled, the path escapes the base folder, or the path is not a directory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /sync/status:
    get:
      summary: Sync status between central and local catalogs
      responses:
        '200':
          description: Pending downloads and uploads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatus'

components:
  parameters:
    PlaylistId:
      in: path
      name: id
      required: true
      schema:
        type: integer

  responses:
    NotFound:
      description: Track, playlist, artist, or audio file not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: Audio track not found
            code: NOT_FOUND
    InternalError:
      description: Unexpected server or storage error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    ApiError:
      type: object
      required: [message, code]
      properties:
        message:
          type: string
          description: Human-readable English message
        code:
          type: string
          description: Stable machine code for clients
          enum:
            - FILE_REQUIRED
            - FILE_TOO_LARGE
            - INVALID_NAME
            - INVALID_FILE
            - INVALID_BODY
            - INVALID_ORDER
            - NOT_FOUND
            - STORAGE_ERROR
            - INTERNAL
            - IMPORT_NOT_CONFIGURED
            - PATH_NOT_ALLOWED
            - RANGE_NOT_SATISFIABLE
    ApiMessage:
      type: object
      required: [message]
      properties:
        message:
          type: string
    Track:
      type: object
      required: [id, path, name, title, extension, createdAt, secondaryTitle, tags]
      properties:
        id:
          type: integer
        name:
          type: string
          description: Display name kept from 0.1.0. On upload it matches title unless name was sent.
        title:
          type: string
          description: Tag title, or the file name without extension when the tag is missing
        secondaryTitle:
          type: string
          nullable: true
          description: Alternate title, such as a translation. Always present; null when unset.
        artist:
          type: string
          nullable: true
          description: Artist text stored on the track. Not an artist id. Null when unset.
        tags:
          type: array
          description: Tag names on this track, sorted case-insensitively. Always present; empty when none.
          items:
            type: string
        album:
          type: string
          nullable: true
        durationSeconds:
          type: integer
          nullable: true
          description: Length in seconds. Null when the file has no readable duration.
        trackNumber:
          type: integer
          nullable: true
        extension:
          type: string
        path:
          type: string
          description: Storage directory recorded for this file
        contentHash:
          type: string
          nullable: true
          description: SHA-256 content hash
        originalFilename:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          description: When the track was added to the library
        checksum:
          type: string
          description: Reserved for future sync support
        updatedAt:
          type: string
          format: date-time
          description: Reserved for future sync support
    TrackPatch:
      type: object
      properties:
        name:
          type: string
        title:
          type: string
        secondaryTitle:
          type: string
          nullable: true
          description: Null or blank clears it. Omitted leaves it unchanged.
        artist:
          type: string
          nullable: true
        album:
          type: string
          nullable: true
        trackNumber:
          type: integer
          nullable: true
          minimum: 1
        durationSeconds:
          type: integer
          nullable: true
          minimum: 0
    PlaylistName:
      type: object
      required: [name]
      properties:
        name:
          type: string
    Playlist:
      type: object
      required: [id, name, createdAt, updatedAt, itemCount, tags]
      properties:
        id:
          type: integer
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        itemCount:
          type: integer
        items:
          type: array
          description: Present on a single playlist and on writes. Omitted from GET /playlists. Each item's audio includes secondaryTitle and tags.
          items:
            $ref: '#/components/schemas/PlaylistItem'
        tags:
          type: array
          description: Tag names on this playlist, sorted case-insensitively. Always present, including on the list.
          items:
            type: string
    TagAssignment:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          maxItems: 100
          description: Full replacement set. Empty clears the subject's tags.
          items:
            type: string
            minLength: 1
            maxLength: 100
    Tag:
      type: object
      required: [id, name, audioCount, artistCount, playlistCount]
      properties:
        id:
          type: integer
        name:
          type: string
          description: Stored spelling. A later assignment with different case reuses this spelling.
        audioCount:
          type: integer
        artistCount:
          type: integer
        playlistCount:
          type: integer
    Artist:
      type: object
      required: [id, name, audioCount, tags]
      properties:
        id:
          type: integer
        name:
          type: string
          description: Exact artist text. Matches audio.artist with the same characters and case.
        audioCount:
          type: integer
        tags:
          type: array
          items:
            type: string
    PlaylistItem:
      type: object
      required: [position, audioId, audio]
      properties:
        position:
          type: integer
          description: 1-based playback order. Gaps can appear after a library track is deleted.
        audioId:
          type: integer
        audio:
          $ref: '#/components/schemas/Track'
    ImportResult:
      type: object
      required: [imported, skipped, failed, ignored, errors]
      properties:
        imported:
          type: integer
        skipped:
          type: integer
          description: Already present by original path or content hash
        failed:
          type: integer
        ignored:
          type: integer
          description: Files that are not in the audio whitelist
        errors:
          type: array
          items:
            type: string
          description: Up to 100 failure messages. failed still counts every failure.
    SyncStatus:
      type: object
      properties:
        pendingDownloads:
          type: array
          items:
            type: integer
        pendingUploads:
          type: array
          items:
            type: integer
