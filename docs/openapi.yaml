openapi: 3.0.3
info:
  title: Audio Streaming API
  version: 0.5.0
  description: |
    Shared contract for the personal music library.
    There is no authentication: the service is meant to be reached only through the private network.
    List responses stay JSON arrays. New fields are added beside the previous ones.
    There is no paging: filters and shuffle apply to the whole list.

    0.3.0 adds secondaryTitle on tracks, an artist catalog copied from track artist text,
    and tags on tracks, artists and playlists.

    0.4.0 adds field filters on tracks, playlists and artists. Filters combine with AND.
    A blank parameter is ignored. A value that matches nothing returns an empty list, not an error.
    GET /audios can also shuffle the filtered list. One tag and q keep the 0.3.0 behaviour.

    0.4.1 adds tag types. System types artist, genre, album, year, language and free cannot be
    renamed or deleted (409 CONFLICT). User-defined types can. Existing tags become type free.
    genre, album and year are derived from the track and are read-only. artist is not stored as a
    tag. language is assigned by hand. GET /audios accepts repeatable f tokens that AND with the
    0.4.0 filters. GET /filter/suggest autocompletes every type, including artists and playlists.

    0.5.0 records listens and exposes instance-wide stats. There is no user id yet; a nullable
    user column can be added later without rewriting play_events. from and to are inclusive
    YYYY-MM-DD dates in Europe/Madrid (STATS_ZONE). Omitting a bound leaves that side open over
    the whole history. plays count only events with counted=true. listenedSeconds sums every
    event in the window, including ones that did not count. Rankings use the current catalog
    names and the tags the track has now.

paths:
  /audios:
    get:
      summary: List tracks, optionally filtered
      parameters:
        - in: query
          name: q
          required: false
          schema:
            type: string
          description: >
            Case- and accent-insensitive substring match on title, secondaryTitle, artist,
            album, display name and original file name. Omitted or blank does not filter.
            AND-combined with title, artist, tag, artistTag, playlistTag and f.
            Without shuffle, results stay ordered by id.
        - in: query
          name: title
          required: false
          schema:
            type: string
          description: >
            Case- and accent-insensitive substring of title or secondaryTitle.
            Does not match artist, album, display name or file name; those stay on q.
            Omitted or blank does not filter.
        - in: query
          name: artist
          required: false
          schema:
            type: string
          description: >
            Case- and accent-insensitive substring of the track artist text (audios.artist).
            Does not match title, album or the artist catalog beyond that stored text.
            A track with no artist does not match. Omitted or blank does not filter.
        - in: query
          name: tag
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          description: >
            Repeat the parameter (?tag=a&tag=b) so the track must have every tag.
            One value keeps the 0.3.0 rule: exact name, case-insensitive and accent-sensitive
            ("jose" does not match "José"). Not a substring. Blank entries are ignored.
            An unknown name returns an empty list.
        - in: query
          name: artistTag
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          description: >
            Repeat so the track is kept only when the artist row whose name equals
            audios.artist exactly ("Ana" and "ana" are different) has every listed tag.
            Same tag name rules as tag. A track with no artist, or whose artist text has
            no row, does not match. Blank entries are ignored. Unknown names return an empty list.
        - in: query
          name: playlistTag
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          description: >
            Repeat so the track must belong to at least one playlist that has every listed tag.
            Tags split across different playlists do not count. Same tag name rules as tag.
            Blank entries are ignored. Unknown names return an empty list.
        - in: query
          name: f
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          description: >
            Repeat (?f=genre:rock&f=año:2010-2015). Every token is required (AND), together with
            q, title, artist, tag, artistTag, playlistTag, shuffle and seed.
            A blank token is ignored. A value that matches nothing returns an empty list.
            An unknown prefix, an empty value or a year that is not YYYY or YYYY-YYYY is 400 INVALID_QUERY.
            Prefixes accept the English key and the Spanish name with or without accents:
            artist/artista, genre/genero/género, album/álbum, year/ano/año, language/idioma, playlist.
            A user type matches its stable key or its visible name (Mood:gym and mood:gym).
            Comparison ignores case and accents and is not a substring (artista:ana does not match Anais).
            year accepts an inclusive range; 2015-2010 is the same as 2010-2015.
            #value or a value with no colon is a free tag (type free).
            artist matches audios.artist. playlist matches a playlist name the track belongs to.
            genre and album match the column or a tag of that type. year matches the column or a year tag.
            Other prefixes match a tag of that type.
        - in: query
          name: shuffle
          required: false
          schema:
            type: string
          description: >
            When true (any case), the filtered list is returned in random order.
            Omitted, blank or false keeps id order. Any other value is 400 INVALID_QUERY.
        - in: query
          name: seed
          required: false
          schema:
            type: integer
            format: int64
          description: >
            Optional integer seed, used only when shuffle=true.
            The same seed and the same filtered set (in id order before the mix) return the same order,
            so a client can repeat the mix. A blank seed is ignored and the mix is not repeatable.
            A non-integer seed is 400 INVALID_QUERY only when shuffle=true; otherwise seed is ignored.
      responses:
        '200':
          description: Track list. A JSON array, not a page.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Track'
        '400':
          description: >
            shuffle is not true or false, seed is not an integer while shuffle=true,
            or an f token has an unknown prefix, an empty value or a bad year.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                message: seed must be an integer
                code: INVALID_QUERY
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Upload an audio file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: mp3, m4a, aac, flac, wav, ogg, opus or webm audio. Default limit 500 MB.
                name:
                  type: string
                  description: Display name. Defaults to the tag title, or the file name without extension.
      responses:
        '201':
          description: File uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMessage'
        '400':
          description: Missing file, unsupported type, or invalid name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          description: File exceeds the configured upload limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                message: File exceeds the maximum upload size of 500MB
                code: FILE_TOO_LARGE
        '500':
          $ref: '#/components/responses/InternalError'

  /audios/{id}:
    get:
      summary: Stream an audio file
      description: >
        Content-Type matches the stored extension (not always audio/mpeg).
        A single Range is honored. A range that starts past the end of the file is 416.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: header
          name: Range
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Full audio stream
        '206':
          description: Partial content for the first byte range
        '416':
          description: Range not satisfiable. Content-Range is bytes */length.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      summary: Edit track metadata
      description: >
        Send only the fields to change. JSON null clears secondaryTitle, artist, album, trackNumber and durationSeconds.
        A blank secondaryTitle is stored as null. title and name cannot be cleared.
        Unknown fields are ignored, including tags. Tag changes use PUT /audios/{id}/tags.
        The whole track object can be sent back.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackPatch'
      responses:
        '200':
          description: Updated track
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '400':
          description: Invalid metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete a track and remove it from every playlist
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Track deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /audios/{id}/tags:
    put:
      summary: Replace the assignable tags of a track
      description: >
        Replaces assignable tags. A string is a free tag (same body as 0.4.0).
        An object is { "type": "mood", "name": "gym" }. type may be the stable key or the visible
        name, with or without accents; omitted type means free. Tags that do not exist yet are created.
        Names are trimmed. Matching ignores case and keeps the stored spelling
        ("LIVE" matches an existing "Live"). Duplicates of the same type and name collapse.
        Derived genre, album and year tags already on the track are kept even when the array
        omits them or is empty. Assigning those types, or artist, by hand is 400 INVALID_BODY
        and changes nothing. An empty array clears assignable tags only and does not delete tag records.
        At most 100 entries. The response is the track. tags stays a list of names.
        GET /audios/{id} still streams audio.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagAssignment'
            example:
              tags: ["Live", "rock"]
      responses:
        '200':
          description: Track with the new tag set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '400':
          description: >
            Missing tags, an entry that is neither a string nor {type, name}, an empty name,
            a name longer than 100 characters, more than 100 entries, an unknown type,
            or a manual assignment of a derived type (genre, album, year) or artist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          $ref: '#/components/responses/NotFound'

  /tags:
    get:
      summary: List tags and how many subjects use each one
      description: >
        Ordered case-insensitively by name, then by type key. A tag with no remaining links stays
        in the list with zero counts. audioCount, artistCount and playlistCount are separate.
        type selects one type by key or visible name (genre, género, Libre). Blank returns every tag.
        artist returns an empty list because artists are not stored as tags. An unknown type returns [].
        readOnly is true for derived genre, album and year tags.
      parameters:
        - in: query
          name: type
          required: false
          schema:
            type: string
          description: Type key or visible name. Case- and accent-insensitive. Blank does not filter.
      responses:
        '200':
          description: Tag catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
              example:
                - id: 1
                  name: Live
                  audioCount: 4
                  artistCount: 1
                  playlistCount: 0
                  readOnly: false
                  type:
                    id: 6
                    key: free
                    name: Libre
                    system: true

  /artists:
    get:
      summary: List artists copied from track artist text
      description: >
        One row per exact artist string (case-sensitive). "Ana" and "ana" are different artists.
        The name matches audio.artist exactly, including spaces.
        Rows come from the 0.3.0 migration (distinct non-blank audio.artist values)
        and from later uploads, imports and PATCH artist changes.
        Clearing a track's artist does not delete the artist row.
        There is no POST /artists. Ordered case-insensitively by name, then by the exact name.
        audioCount is the number of tracks whose artist text equals name.
        q is a case- and accent-insensitive substring of the artist name.
        tag may be repeated (?tag=a&tag=b); the artist must have every tag.
        Tag names follow the track rule (case-insensitive, accent-sensitive, not a substring).
        Blank q or tag values are ignored. Unknown names return an empty list.
        Filters do not change the order of the artists that remain.
      parameters:
        - in: query
          name: q
          required: false
          schema:
            type: string
          description: Case- and accent-insensitive substring of the artist name. Blank does not filter.
        - in: query
          name: tag
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          description: >
            Repeat so the artist must have every tag. Same name rules as GET /audios tag.
            Blank entries are ignored. An unknown name returns an empty list.
      responses:
        '200':
          description: Artist catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Artist'
              example:
                - id: 4
                  name: José
                  audioCount: 9
                  tags: ["Live"]

  /artists/{id}/tags:
    put:
      summary: Replace the tags of an artist
      description: >
        Same replacement rules as PUT /audios/{id}/tags, including typed objects and preserved derived tags.
        Does not change the artist name or any track's artist text. Artists do not receive derived tags
        unless one was already linked; new derived assignments are 400.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagAssignment'
      responses:
        '200':
          description: Artist with the new tag set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artist'
        '400':
          description: Invalid tag list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Artist not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                message: Artist not found
                code: NOT_FOUND

  /playlists:
    get:
      summary: List playlists without their tracks
      description: >
        Ordered by id. q is a case- and accent-insensitive substring of the playlist name.
        tag may be repeated; the playlist must have every tag, with the same name rules as GET /audios.
        Blank values are ignored. Unknown names return an empty list. items stays omitted.
      parameters:
        - in: query
          name: q
          required: false
          schema:
            type: string
          description: Case- and accent-insensitive substring of the playlist name. Blank does not filter.
        - in: query
          name: tag
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          description: >
            Repeat so the playlist must have every tag. Same name rules as GET /audios tag.
            Blank entries are ignored. An unknown name returns an empty list.
      responses:
        '200':
          description: Playlist summaries. items is omitted; use GET /playlists/{id} for the tracks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Playlist'
    post:
      summary: Create a playlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaylistName'
      responses:
        '201':
          description: Created playlist, with an empty items array
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '400':
          description: Missing or invalid name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /playlists/{id}:
    get:
      summary: Get a playlist and its tracks in playback order
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
      responses:
        '200':
          description: Playlist with items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Rename a playlist
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaylistName'
      responses:
        '200':
          description: Updated playlist, including its items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '400':
          description: Invalid name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete a playlist
      description: Does not delete the tracks themselves.
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
      responses:
        '204':
          description: Playlist deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /playlists/{id}/tags:
    put:
      summary: Replace the tags of a playlist
      description: >
        Same replacement rules as PUT /audios/{id}/tags, including typed objects.
        Derived tags already on the playlist are kept. The response includes items and tags.
        updatedAt changes.
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagAssignment'
      responses:
        '200':
          description: Playlist with items and the new tag set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '400':
          description: Invalid tag list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          $ref: '#/components/responses/NotFound'

  /playlists/{id}/items:
    post:
      summary: Append a track
      description: >
        Adding a track that is already in the playlist returns 200 and does not duplicate it.
        A new track returns 201 and is placed at the end.
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audioId]
              properties:
                audioId:
                  type: integer
      responses:
        '200':
          description: Track was already in the playlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistItem'
        '201':
          description: Track appended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistItem'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Reorder the tracks
      description: >
        The list must contain exactly the audio ids already in the playlist, each once.
        Preferred body is {"audioIds":[3,1,2]}. A raw JSON array [3,1,2] is also accepted.
        Positions are rewritten from 1 in that order.
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audioIds]
              properties:
                audioIds:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: Playlist in the new order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '400':
          description: The list is not a permutation of the current tracks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          $ref: '#/components/responses/NotFound'

  /playlists/{id}/items/{audioId}:
    delete:
      summary: Remove a track from a playlist
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
        - in: path
          name: audioId
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Track removed from the playlist
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/import:
    post:
      summary: Copy every audio file under a server folder into the library
      description: >
        Recursive. Reads tags. Skips a file when its original path or content hash is already stored.
        Does not move or delete the originals. Non-audio files are ignored.
        The path must stay inside AUDIO_IMPORT_DIR. A missing path imports that directory itself.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  description: Absolute path, or a path relative to AUDIO_IMPORT_DIR.
      responses:
        '200':
          description: Import summary. Individual unreadable files increment failed and do not abort the run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '400':
          description: Import is disabled, the path escapes the base folder, or the path is not a directory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /admin/tags/rebuild-system:
    post:
      summary: Rebuild derived genre, album and year tags for the whole library
      description: >
        Reads each stored audio file and realigns genre, year and the derived tags.
        Does not change title, secondaryTitle or artist. An album that already has text is kept;
        a blank album is filled from the file. Idempotent: a second run with the same files
        reports those tracks as unchanged. A missing or unreadable file is counted as failed
        and its stored fields are left as they are. Unused derived tags are removed afterwards.
        Language, free and user tags are not modified.
      responses:
        '200':
          description: Rebuild summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebuildResult'
        '500':
          $ref: '#/components/responses/InternalError'

  /tag-types:
    get:
      summary: List tag types
      description: >
        System types come first, in a fixed order: artist, genre, album, year, language, free.
        User types follow, ordered by name. count for artist is the number of artist rows.
        count for every other type is the number of tags of that type. color is null when unset.
        artist is virtual (resolved against the artist table). genre, album and year are derived
        and cannot be assigned by hand. language and free can. System types cannot be renamed or deleted.
      responses:
        '200':
          description: Tag types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagType'
    post:
      summary: Create a user tag type
      description: >
        key is a stable slug of name (accents folded, case ignored) and does not change later.
        A name that collides with a system type, a reserved prefix (including playlist) or an
        existing type is 409 CONFLICT. color is optional, at most 32 characters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagTypeCreate'
            example:
              name: Mood
              color: "#112233"
      responses:
        '201':
          description: Created type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagType'
        '400':
          description: Missing or invalid name, or a color longer than 32 characters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The name or key is reserved or already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                message: This name is reserved
                code: CONFLICT

  /tag-types/{id}:
    patch:
      summary: Rename a user tag type or change its color
      description: >
        Send only the fields to change. name updates the visible name and leaves key unchanged.
        JSON null clears color. A system type is 409 CONFLICT, including an empty body.
        A name reserved or already used by another type is 409.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagTypePatch'
      responses:
        '200':
          description: Updated type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagType'
        '400':
          description: Invalid name or color
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Tag type not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: System type, or the new name is reserved or already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      summary: Delete a user tag type and its tags
      description: >
        Removes the type, its tags and every link from tracks, artists and playlists.
        Does not delete those tracks, artists or playlists. A system type is 409 CONFLICT.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Type deleted
        '404':
          description: Tag type not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: System type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                message: System tag types cannot be deleted
                code: CONFLICT

  /filter/suggest:
    get:
      summary: Suggest filter values
      description: >
        Autocomplete for the f tokens. Each item is { type, value, count }.
        type is a stable key: artist, genre, album, year, language, free, playlist, or a user type key.
        value is one stored spelling. count is how many tracks the matching f token would return.
        Suggestions with a zero count are omitted.
        prefix empty returns every type. Otherwise it matches a key, an alias or a visible name
        (género, ano, libre) exactly, or the start of one of those when nothing matches exactly.
        An unknown prefix returns an empty list, not an error.
        q matches the start of the value, ignoring case and accents. Blank q does not filter values.
      parameters:
        - in: query
          name: prefix
          required: false
          schema:
            type: string
        - in: query
          name: q
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Suggestions ordered by type, then by value
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FilterSuggestion'
              example:
                - type: genre
                  value: Rock
                  count: 120

  /plays:
    post:
      summary: Record a listen
      description: >
        201 with the stored event. A repeated clientEventId returns 200 and the original event;
        the new body is ignored. Blank clientEventId is stored as null, so blanks do not collide.
        Surrounding whitespace is trimmed. listenedSeconds is capped at durationSeconds + 5
        (STATS_LISTENED_SLACK_SECONDS) when the duration is known, and counted is computed from
        that stored value. counted is true when stored seconds reach
        min(STATS_MIN_COUNTED_SECONDS, durationSeconds * STATS_COUNTED_DURATION_RATIO)
        (defaults 30 and 0.5). Unknown duration uses the minimum alone. The ratio is a real
        number, so a threshold of 15.5 needs 16 seconds. Duration 0 counts any non-negative listen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayEventRequest'
      responses:
        '201':
          description: Listen stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayEvent'
        '200':
          description: clientEventId already existed. The stored event is returned unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayEvent'
        '400':
          description: >
            Unknown audio, unknown playlist, missing or negative listenedSeconds,
            source outside the allowed list, or a body that cannot be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                message: Audio not found
                code: INVALID_BODY
        '500':
          $ref: '#/components/responses/InternalError'
  /plays/{id}:
    delete:
      summary: Delete one listen
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Event deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /stats/summary:
    get:
      summary: Listening totals for a date window
      parameters:
        - $ref: '#/components/parameters/StatsFrom'
        - $ref: '#/components/parameters/StatsTo'
      responses:
        '200':
          description: >
            plays and distinct counts use counted events only.
            listenedSeconds sums every event in the window.
            from and to echo the query and are null when omitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsSummary'
        '400':
          description: from or to is not YYYY-MM-DD, or from is after to
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                message: from must be a date (YYYY-MM-DD)
                code: INVALID_QUERY
        '500':
          $ref: '#/components/responses/InternalError'
  /stats/top:
    get:
      summary: Rank tracks, artists, tags or playlists
      parameters:
        - in: query
          name: kind
          required: true
          schema:
            type: string
            enum: [audio, artist, tag, playlist]
          description: Case-insensitive. audio uses the track title. artist uses the artists table.
        - $ref: '#/components/parameters/StatsFrom'
        - $ref: '#/components/parameters/StatsTo'
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            default: 20
          description: Positive integer. Default 20. There is no maximum.
        - in: query
          name: tagType
          required: false
          schema:
            type: string
          description: >
            Type key, used only when kind=tag (genre, not Género). An unknown key returns an empty list.
            Ignored for other kinds. Blank is ignored.
      responses:
        '200':
          description: >
            JSON array ordered by plays descending, then listenedSeconds descending, then id ascending.
            A row is included only when it has at least one counted play.
            plays counts those events. listenedSeconds sums every event in the window for that row.
            One listen is attributed in full to every tag the track currently has.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StatsRank'
        '400':
          description: kind is missing or unknown, or limit is not a positive integer, or the date window is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                message: kind must be audio, artist, tag or playlist
                code: INVALID_QUERY
        '500':
          $ref: '#/components/responses/InternalError'
  /stats/timeline:
    get:
      summary: Listening series with empty periods filled
      parameters:
        - in: query
          name: granularity
          required: true
          schema:
            type: string
            enum: [day, month, year]
          description: Case-insensitive. Buckets use STATS_ZONE (Europe/Madrid by default), not UTC.
        - $ref: '#/components/parameters/StatsFrom'
        - $ref: '#/components/parameters/StatsTo'
      responses:
        '200':
          description: >
            Chronological array. period is YYYY-MM-DD, YYYY-MM or YYYY.
            plays counts counted events. listenedSeconds sums every event.
            A closed from/to range is filled with zeros even when it has no events.
            An open end is anchored by the first or last event; if nothing anchors it, the array is empty.
            With neither bound, the series runs from the first event to the last, or is empty.
            2026-01-15T23:30:00Z falls on 2026-01-16 in Europe/Madrid.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StatsTimelinePoint'
              example:
                - period: '2026-01-15'
                  plays: 1
                  listenedSeconds: 40
                - period: '2026-01-16'
                  plays: 1
                  listenedSeconds: 40
                - period: '2026-01-17'
                  plays: 0
                  listenedSeconds: 0
        '400':
          description: granularity is missing or unknown, or the date window is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                message: granularity must be day, month or year
                code: INVALID_QUERY
        '500':
          $ref: '#/components/responses/InternalError'
  /sync/status:
    get:
      summary: Sync status between central and local catalogs
      responses:
        '200':
          description: Pending downloads and uploads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatus'

components:
  parameters:
    PlaylistId:
      in: path
      name: id
      required: true
      schema:
        type: integer
    StatsFrom:
      in: query
      name: from
      required: false
      schema:
        type: string
        format: date
        example: '2026-01-15'
      description: >
        Inclusive calendar date (YYYY-MM-DD) in STATS_ZONE, default Europe/Madrid.
        Omitted means the start of the history. Blank is treated as omitted.
    StatsTo:
      in: query
      name: to
      required: false
      schema:
        type: string
        format: date
        example: '2026-01-31'
      description: >
        Inclusive calendar date (YYYY-MM-DD) in STATS_ZONE.
        Omitted means the end of the history. Blank is treated as omitted.
        A value before from is 400 INVALID_QUERY.

  responses:
    NotFound:
      description: Track, playlist, artist, audio file, or play event not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: Audio track not found
            code: NOT_FOUND
    InternalError:
      description: Unexpected server or storage error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    ApiError:
      type: object
      required: [message, code]
      properties:
        message:
          type: string
          description: Human-readable English message
        code:
          type: string
          description: Stable machine code for clients
          enum:
            - FILE_REQUIRED
            - FILE_TOO_LARGE
            - INVALID_NAME
            - INVALID_FILE
            - INVALID_BODY
            - INVALID_QUERY
            - INVALID_ORDER
            - NOT_FOUND
            - STORAGE_ERROR
            - INTERNAL
            - IMPORT_NOT_CONFIGURED
            - PATH_NOT_ALLOWED
            - RANGE_NOT_SATISFIABLE
            - CONFLICT
    ApiMessage:
      type: object
      required: [message]
      properties:
        message:
          type: string
    Track:
      type: object
      required: [id, path, name, title, extension, createdAt, secondaryTitle, tags]
      properties:
        id:
          type: integer
        name:
          type: string
          description: Display name kept from 0.1.0. On upload it matches title unless name was sent.
        title:
          type: string
          description: Tag title, or the file name without extension when the tag is missing
        secondaryTitle:
          type: string
          nullable: true
          description: Alternate title, such as a translation. Always present; null when unset.
        artist:
          type: string
          nullable: true
          description: Artist text stored on the track. Not an artist id. Null when unset.
        tags:
          type: array
          description: >
            Tag names on this track, sorted case-insensitively. Always present; empty when none.
            Includes derived genre, album and year names. The same name can appear twice when two
            types share it. Type and readOnly come from GET /tags.
          items:
            type: string
        album:
          type: string
          nullable: true
        genre:
          type: string
          nullable: true
          description: Genre read from the file. Null when unknown. Also published as a read-only tag.
        year:
          type: integer
          nullable: true
          description: Year read from the file. Null when unknown. Also published as a read-only tag.
        durationSeconds:
          type: integer
          nullable: true
          description: Length in seconds. Null when the file has no readable duration.
        trackNumber:
          type: integer
          nullable: true
        extension:
          type: string
        path:
          type: string
          description: Storage directory recorded for this file
        contentHash:
          type: string
          nullable: true
          description: SHA-256 content hash
        originalFilename:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          description: When the track was added to the library
        checksum:
          type: string
          description: Reserved for future sync support
        updatedAt:
          type: string
          format: date-time
          description: Reserved for future sync support
    TrackPatch:
      type: object
      properties:
        name:
          type: string
        title:
          type: string
        secondaryTitle:
          type: string
          nullable: true
          description: Null or blank clears it. Omitted leaves it unchanged.
        artist:
          type: string
          nullable: true
        album:
          type: string
          nullable: true
          description: >
            Null clears it and removes the derived album tag. Omitted leaves album and its tag unchanged.
            genre and year are not editable here.
        trackNumber:
          type: integer
          nullable: true
          minimum: 1
        durationSeconds:
          type: integer
          nullable: true
          minimum: 0
    PlaylistName:
      type: object
      required: [name]
      properties:
        name:
          type: string
    Playlist:
      type: object
      required: [id, name, createdAt, updatedAt, itemCount, tags]
      properties:
        id:
          type: integer
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        itemCount:
          type: integer
        items:
          type: array
          description: Present on a single playlist and on writes. Omitted from GET /playlists. Each item's audio includes secondaryTitle and tags.
          items:
            $ref: '#/components/schemas/PlaylistItem'
        tags:
          type: array
          description: Tag names on this playlist, sorted case-insensitively. Always present, including on the list.
          items:
            type: string
    TagAssignment:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          maxItems: 100
          description: >
            Assignable tags only. A string is a free tag and stays compatible with 0.4.0.
            An object sets the type. Empty clears assignable tags and keeps derived ones.
          items:
            oneOf:
              - type: string
                minLength: 1
                maxLength: 100
              - type: object
                required: [name]
                properties:
                  type:
                    type: string
                    description: Type key or visible name. Omitted means free.
                  name:
                    type: string
                    minLength: 1
                    maxLength: 100
    Tag:
      type: object
      required: [id, name, audioCount, artistCount, playlistCount, readOnly, type]
      properties:
        id:
          type: integer
        name:
          type: string
          description: Stored spelling. A later assignment with different case reuses this spelling.
        audioCount:
          type: integer
        artistCount:
          type: integer
        playlistCount:
          type: integer
        readOnly:
          type: boolean
          description: True for derived genre, album and year tags. Those cannot be assigned or removed by hand.
        type:
          $ref: '#/components/schemas/TagTypeRef'
    TagTypeRef:
      type: object
      required: [id, key, name, system]
      properties:
        id:
          type: integer
        key:
          type: string
          description: Stable key. artist, genre, album, year, language, free, or a user slug.
        name:
          type: string
        system:
          type: boolean
    TagType:
      type: object
      required: [id, key, name, system, color, count]
      properties:
        id:
          type: integer
        key:
          type: string
        name:
          type: string
        system:
          type: boolean
        color:
          type: string
          nullable: true
        count:
          type: integer
          description: Artist rows for type artist. Tag rows for every other type.
    TagTypeCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        color:
          type: string
          nullable: true
          maxLength: 32
    TagTypePatch:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        color:
          type: string
          nullable: true
          maxLength: 32
    FilterSuggestion:
      type: object
      required: [type, value, count]
      properties:
        type:
          type: string
        value:
          type: string
        count:
          type: integer
    RebuildResult:
      type: object
      required: [processed, updated, unchanged, failed]
      properties:
        processed:
          type: integer
        updated:
          type: integer
          description: Tracks whose genre, year, album or derived tags changed.
        unchanged:
          type: integer
        failed:
          type: integer
          description: Stored file missing or unreadable. Those tracks are not modified.
    Artist:
      type: object
      required: [id, name, audioCount, tags]
      properties:
        id:
          type: integer
        name:
          type: string
          description: Exact artist text. Matches audio.artist with the same characters and case.
        audioCount:
          type: integer
        tags:
          type: array
          items:
            type: string
    PlaylistItem:
      type: object
      required: [position, audioId, audio]
      properties:
        position:
          type: integer
          description: 1-based playback order. Gaps can appear after a library track is deleted.
        audioId:
          type: integer
        audio:
          $ref: '#/components/schemas/Track'
    ImportResult:
      type: object
      required: [imported, skipped, failed, ignored, errors]
      properties:
        imported:
          type: integer
        skipped:
          type: integer
          description: Already present by original path or content hash
        failed:
          type: integer
        ignored:
          type: integer
          description: Files that are not in the audio whitelist
        errors:
          type: array
          items:
            type: string
          description: Up to 100 failure messages. failed still counts every failure.
    PlayEventRequest:
      type: object
      required: [audioId, listenedSeconds]
      properties:
        audioId:
          type: integer
        startedAt:
          type: string
          format: date-time
          description: ISO-8601 instant. Omitted means now.
        listenedSeconds:
          type: integer
          minimum: 0
          description: Seconds actually heard. Capped when the track duration is known.
        completed:
          type: boolean
          description: Omitted means false.
        source:
          type: string
          nullable: true
          enum: [library, search, playlist, artist, shuffle, other]
          description: Case-insensitive. Stored in lowercase. Omitted or blank is null.
        playlistId:
          type: integer
          nullable: true
          description: Optional. Unknown id is 400. Deleting the playlist sets this back to null.
        clientEventId:
          type: string
          nullable: true
          description: Idempotency key. Trimmed. Blank is null. Unique when present.
    PlayEvent:
      type: object
      required:
        - id
        - audioId
        - startedAt
        - listenedSeconds
        - completed
        - counted
        - source
        - playlistId
        - clientEventId
        - createdAt
      properties:
        id:
          type: integer
        audioId:
          type: integer
        startedAt:
          type: string
          format: date-time
        listenedSeconds:
          type: integer
          minimum: 0
        completed:
          type: boolean
        counted:
          type: boolean
          description: True when the stored listen reached the configured threshold.
        source:
          type: string
          nullable: true
          enum: [library, search, playlist, artist, shuffle, other]
        playlistId:
          type: integer
          nullable: true
        clientEventId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    StatsSummary:
      type: object
      required: [plays, listenedSeconds, distinctAudios, distinctArtists, from, to]
      properties:
        plays:
          type: integer
          format: int64
          description: Events with counted=true.
        listenedSeconds:
          type: integer
          format: int64
          description: Sum of listenedSeconds for every event in the window.
        distinctAudios:
          type: integer
          format: int64
          description: Distinct tracks among counted events.
        distinctArtists:
          type: integer
          format: int64
          description: >
            Distinct artists rows whose name equals the track artist exactly, among counted events.
            A counted play with no matching artists row is not included.
        from:
          type: string
          format: date
          nullable: true
        to:
          type: string
          format: date
          nullable: true
    StatsRank:
      type: object
      required: [id, name, plays, listenedSeconds]
      properties:
        id:
          type: integer
          description: Track, artist, tag or playlist id, depending on kind.
        name:
          type: string
          description: Current title, artist name, tag name or playlist name.
        secondaryName:
          type: string
          description: >
            Track artist, or the tag type's visible name (Género, Álbum, Año, Libre).
            Omitted for artists, playlists, and tracks with no artist.
        plays:
          type: integer
          format: int64
        listenedSeconds:
          type: integer
          format: int64
    StatsTimelinePoint:
      type: object
      required: [period, plays, listenedSeconds]
      properties:
        period:
          type: string
          description: YYYY-MM-DD, YYYY-MM or YYYY in STATS_ZONE.
        plays:
          type: integer
          format: int64
        listenedSeconds:
          type: integer
          format: int64
    SyncStatus:
      type: object
      properties:
        pendingDownloads:
          type: array
          items:
            type: integer
        pendingUploads:
          type: array
          items:
            type: integer
