spring.application.name=music-streaming-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/music-streaming-db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.sql.init.mode=never

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# AUDIO_MAX_REQUEST_SIZE must be at least AUDIO_MAX_FILE_SIZE.
spring.servlet.multipart.max-file-size=${AUDIO_MAX_FILE_SIZE:500MB}
spring.servlet.multipart.max-request-size=${AUDIO_MAX_REQUEST_SIZE:510MB}
server.tomcat.max-http-form-post-size=${AUDIO_MAX_REQUEST_SIZE:510MB}
server.tomcat.max-swallow-size=${AUDIO_MAX_REQUEST_SIZE:510MB}

# Blank keeps the historical relative directory uploads/songs/.
app.storage.dir=${AUDIO_STORAGE_DIR:}

# Comma-separated browser origins, or * for any origin.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Folder import refuses anything outside this directory. Blank disables it.
app.import.dir=${AUDIO_IMPORT_DIR:}

# Listening stats. from/to and timeline buckets use this zone. Dates are inclusive.
app.stats.zone=${STATS_ZONE:Europe/Madrid}
app.stats.min-counted-seconds=${STATS_MIN_COUNTED_SECONDS:30}
app.stats.counted-duration-ratio=${STATS_COUNTED_DURATION_RATIO:0.5}
app.stats.listened-slack-seconds=${STATS_LISTENED_SLACK_SECONDS:5}
